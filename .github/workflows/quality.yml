name: Tests and Explore evals
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:evals
      - run: npm run eval:explore -- --out artifacts/evals/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explore-evals-${{ github.run_id }}
          path: artifacts/evals/ci/
          if-no-files-found: warn
          retention-days: 14
