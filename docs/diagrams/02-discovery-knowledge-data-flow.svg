<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440" role="img" aria-labelledby="title desc"><title id="title">02  Public discovery → knowledge → grounded answers</title><desc id="desc">Catalog links can appear before source enrichment or vectors. Shared public knowledge is reused across students.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97A8BE"/></marker></defs><rect width="1920" height="1440" fill="#F6F8FC"/>
<text x="60" y="65" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#18334D">02  Public discovery → knowledge → grounded answers</text>
<text x="60" y="103" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#53677E">Catalog links can appear before source enrichment or vectors. Shared public knowledge is reused across students.</text>
<text x="60" y="1400" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">PATHWAY AI  |  Implemented baseline: main 1878d9e, Growth Map Drops 1–3  |  Deployment readiness is checked separately</text>
<text x="1810" y="1400" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#53677E">2 / 3</text>
<rect x="50" y="155" width="1820" height="510" rx="22" fill="#EDF2F9" stroke="#D5DFEB" stroke-width="2"/>
<text x="74" y="191" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315EEA">PUBLIC OPPORTUNITY DISCOVERY</text>
<text x="74" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">P = public research flow. Durable SQL state and usage are recorded between bounded stages.</text>
<rect x="80" y="275" width="320" height="178" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="80" y="293" width="5" height="142" rx="2" fill="#315EEA"/>
<text x="102" y="300" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">P1  Check coverage</text>
<text x="102" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Interests + grade band</text>
<text x="102" y="358.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Broad region / preferences</text>
<text x="102" y="381.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Reuse SQL catalog first</text>
<rect x="436" y="275" width="320" height="178" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="436" y="293" width="5" height="142" rx="2" fill="#315EEA"/>
<text x="458" y="300" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">P2  Funded research</text>
<text x="458" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Sanitized public context</text>
<text x="458" y="358.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Provider returns real URLs</text>
<text x="458" y="381.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Budgeted calls and spend</text>
<rect x="792" y="275" width="320" height="178" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="792" y="293" width="5" height="142" rx="2" fill="#315EEA"/>
<text x="814" y="300" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">P3  Save links FIRST</text>
<text x="814" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Recover actual citations</text>
<text x="814" y="358.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Save program + candidate in</text>
<text x="814" y="381.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">SQL</text>
<text x="814" y="404.7200000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Keep unconfirmed links</text>
<rect x="1148" y="275" width="320" height="178" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1148" y="293" width="5" height="142" rx="2" fill="#315EEA"/>
<text x="1170" y="300" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">P4  Read source page</text>
<text x="1170" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Best-effort safe HTML fetch</text>
<text x="1170" y="358.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Match quotes against real text</text>
<text x="1170" y="381.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Extraction model is optional</text>
<rect x="1504" y="275" width="320" height="178" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1504" y="293" width="5" height="142" rx="2" fill="#315EEA"/>
<text x="1526" y="300" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">P5  Qualify &amp; display</text>
<text x="1526" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Keep only supported facts</text>
<text x="1526" y="358.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Warn on unknown details</text>
<text x="1526" y="381.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Only confirmed past deadline</text>
<text x="1526" y="404.7200000000001" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">excludes</text>
