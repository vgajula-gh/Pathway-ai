<polyline points="1468,364 1504,364" fill="none" stroke="#97A8BE" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="240,275 240,237 1664,237 1664,275" fill="none" stroke="#97A8BE" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="634.0" y="230" width="632" height="27" rx="6" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="2"/>
<text x="644.0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#18334D">Enough current links: return catalog picks without a new paid search</text>
<rect x="80" y="495" width="550" height="130" rx="16" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="2"/>
<rect x="80" y="513" width="5" height="94" rx="2" fill="#7454B5"/>
<text x="102" y="520" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Persist and resume</text>
<text x="102" y="555.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">DiscoveryRun stage / in-flight marker + candidates</text>
<text x="102" y="578.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Job leases, usage and bounded retry state</text>
<text x="102" y="601.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Unknown paid outcomes are not silently replayed.</text>
<rect x="665" y="495" width="550" height="130" rx="16" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="2"/>
<rect x="665" y="513" width="5" height="94" rx="2" fill="#087F82"/>
<text x="687" y="520" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Student-visible results</text>
<text x="687" y="555.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Up to 5 confirmed Free + 5 Paid/cost-unconfirmed</text>
<text x="687" y="578.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Missing prices never become “Free”.</text>
<text x="687" y="601.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Unreadable sources can remain “Needs checking”.</text>
<rect x="1250" y="495" width="590" height="130" rx="16" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1250" y="513" width="5" height="94" rx="2" fill="#315EEA"/>
<text x="1272" y="520" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Default evidence-first mode</text>
<text x="1272" y="555.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Research quotes are checked in code after one page fetch.</text>
<text x="1272" y="578.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">No additional extraction model call for each candidate.</text>
<text x="1272" y="601.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Optional fetch_and_extract has separate bounded work.</text>
<rect x="50" y="705" width="1820" height="585" rx="22" fill="#EDF2F9" stroke="#D5DFEB" stroke-width="2"/>
<text x="74" y="741" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315EEA">PUBLIC KNOWLEDGE + PRIVATE QUESTION</text>
<text x="74" y="771" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">I = public ingestion. Q = authenticated, server-scoped retrieval. Preparation is separate from catalog visibility.</text>
<rect x="80" y="805" width="530" height="135" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="80" y="823" width="5" height="99" rx="2" fill="#315EEA"/>
<text x="102" y="830" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">I1  Real source text</text>
<text x="102" y="865.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">SQL: page text, URL, check date and hash</text>
<text x="102" y="888.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Bounded preparation fetches missing / stale sources</text>
<rect x="695" y="805" width="530" height="135" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="695" y="823" width="5" height="99" rx="2" fill="#315EEA"/>
<text x="717" y="830" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">I2  Chunk &amp; embed public text</text>
<text x="717" y="865.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">LangChain: about 500 words, 50-word overlap</text>
<text x="717" y="888.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Independent embedding model / output dimension</text>
<rect x="1310" y="805" width="530" height="135" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1310" y="823" width="5" height="99" rx="2" fill="#315EEA"/>
<text x="1332" y="830" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">I3  Store matching knowledge</text>
<text x="1332" y="865.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Vectors: optional Pinecone / pgvector / local memory</text>
<text x="1332" y="888.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">SQL chunks: source hash, model, store and metadata</text>
