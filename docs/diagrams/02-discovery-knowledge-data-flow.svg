<text x="1116.0" y="986" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#18334D">Public index + SQL-backed chunks</text>
<polyline points="1664,1210 1664,1255 952,1255 952,1210" fill="none" stroke="#97A8BE" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="1001.0" y="1234" width="578" height="27" rx="6" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="2"/>
<text x="1011.0" y="1254" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#18334D">At most 3 retrieval/draft rounds; no repeated normalized query</text>
<text x="70" y="1332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Privacy: no student profile, goal, chat or reflection is written into the shared vector namespace.</text>
<text x="70" y="1359" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Failure: a source/index/model outage can disable grounded answers without removing catalog cards or saved applications.</text>
