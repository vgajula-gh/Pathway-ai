<rect x="80" y="1058" width="5" height="134" rx="2" fill="#087F82"/>
<text x="102" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Q1  Student question</text>
<text x="102" y="1100.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Owned signed-in conversation</text>
<text x="102" y="1123.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Question + recent history</text>
<text x="102" y="1146.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">No client-defined scope list</text>
<rect x="436" y="1040" width="320" height="170" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="436" y="1058" width="5" height="134" rx="2" fill="#087F82"/>
<text x="458" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Q2  Authorize scope</text>
<text x="458" y="1100.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Current picks + Interested</text>
<text x="458" y="1123.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Bind allowed program IDs</text>
<text x="458" y="1146.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Check knowledge readiness</text>
<rect x="792" y="1040" width="320" height="170" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="792" y="1058" width="5" height="134" rx="2" fill="#087F82"/>
<text x="814" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Q3  Retrieve &amp; join</text>
<text x="814" y="1100.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Filtered vector query</text>
<text x="814" y="1123.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">SQL validates hash and scope</text>
<text x="814" y="1146.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Rerank; up to 5 passages</text>
<rect x="1148" y="1040" width="320" height="170" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1148" y="1058" width="5" height="134" rx="2" fill="#087F82"/>
<text x="1170" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Q4  Draft excerpt JSON</text>
<text x="1170" y="1100.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Model sees scoped passages</text>
<text x="1170" y="1123.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Select exact source quotes</text>
<text x="1170" y="1146.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Code verifies each excerpt</text>
<rect x="1504" y="1040" width="320" height="170" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1504" y="1058" width="5" height="134" rx="2" fill="#087F82"/>
<text x="1526" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Q5  Verified answer</text>
<text x="1526" y="1100.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">SQL facts + verified excerpts</text>
<text x="1526" y="1123.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Citations and source dates</text>
<text x="1526" y="1146.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Recheck current membership</text>
