<text x="102" y="535.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Revalidate; action transaction</text>
<text x="102" y="558.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Read back saved records</text>
<text x="102" y="581.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">VERIFIED / FAILED + SQL audit</text>
