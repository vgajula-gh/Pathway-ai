<text x="74" y="826" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#A45C18">OPTIONAL INTEGRATIONS &amp; OPERATIONAL FLOWS</text>
<text x="74" y="856" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">All remain separate from autonomous external applications or calendar editing.</text>
<rect x="80" y="890" width="415" height="240" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="80" y="908" width="5" height="204" rx="2" fill="#A45C18"/>
<text x="102" y="915" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Calendar reads</text>
<text x="102" y="950.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Student submits private HTTPS iCal URL</text>
<text x="102" y="973.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Encrypted at rest with CALENDAR_SECRET</text>
<text x="102" y="996.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Worker fetches due feed → imported SQL</text>
<text x="102" y="1019.7199999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">events</text>
<text x="102" y="1042.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Read-only locally; removal is explicit</text>
<rect x="525" y="890" width="415" height="240" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="525" y="908" width="5" height="204" rx="2" fill="#A45C18"/>
<text x="547" y="915" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Words &amp; publisher news</text>
<text x="547" y="950.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">500 curated words → local selection /</text>
<text x="547" y="973.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">audio</text>
<text x="547" y="996.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">RSS / Atom → metadata → shared news SQL</text>
<text x="547" y="1019.7199999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Explicit refresh, cached and bounded</text>
<text x="547" y="1042.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Headlines are not generated by an LLM</text>
<rect x="970" y="890" width="415" height="240" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="970" y="908" width="5" height="204" rx="2" fill="#A45C18"/>
<text x="992" y="915" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Browser voice &amp; PWA</text>
<text x="992" y="950.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Speech recognition → editable message</text>
<text x="992" y="973.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">draft</text>
<text x="992" y="996.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Student explicitly sends resulting text</text>
<text x="992" y="1019.7199999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Browser may process audio; Pathway stores</text>
<text x="992" y="1042.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">no audio</text>
<text x="992" y="1065.8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Service worker caches public shell, not</text>
<text x="992" y="1088.84" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">private API data</text>
<rect x="1415" y="890" width="415" height="240" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1415" y="908" width="5" height="204" rx="2" fill="#A45C18"/>
<text x="1437" y="915" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Gentle browser push</text>
<text x="1437" y="950.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Opt-in + permission → private</text>
<text x="1437" y="973.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">subscription</text>
<text x="1437" y="996.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Worker checks local schedule / quiet</text>
<text x="1437" y="1019.7199999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">rules</text>
<text x="1437" y="1042.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Reserve one daily nudge before send</text>
<text x="1437" y="1065.8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Push acceptance is not delivery</text>
<text x="1437" y="1088.84" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">confirmation</text>
<rect x="50" y="1220" width="880" height="120" rx="16" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="2"/>
<rect x="50" y="1238" width="5" height="84" rx="2" fill="#7454B5"/>
<text x="72" y="1245" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Owner / release path</text>
<text x="72" y="1280.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">JOBS_SECRET protects owner jobs; Secrets stay on the server.</text>
<text x="72" y="1303.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Publish applies reviewed production schema changes.</text>
<text x="72" y="1326.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Core health does not prove feature-table readiness.</text>
<rect x="970" y="1220" width="900" height="120" rx="16" fill="#FFFFFF" stroke="#D5DFEB" stroke-width="2"/>
<rect x="970" y="1238" width="5" height="84" rx="2" fill="#087F82"/>
<text x="992" y="1245" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">Persistence / failure path</text>
<text x="992" y="1280.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">SQL owns personal records, public catalog, usage, leases and audit.</text>
<text x="992" y="1303.6399999999999" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Sleeping hosts need visits / owner jobs to catch up.</text>
<text x="992" y="1326.6799999999998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">AI-off/capped: manual features and existing records remain.</text>
