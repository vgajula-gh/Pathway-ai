<text x="1482" y="330.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Suggestions start unselected</text>
<text x="1482" y="353.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Student confirms skill / stage</text>
<text x="1482" y="376.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Interested is not achievement</text>
<rect x="1460" y="475" width="360" height="145" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
