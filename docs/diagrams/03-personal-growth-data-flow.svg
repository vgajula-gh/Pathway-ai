<text x="1482" y="500" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">G3  Rules + bounded AI</text>
<text x="1482" y="535.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Code counts evidence and trends</text>
<text x="1482" y="558.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Model selects factual wording</text>
<text x="1482" y="581.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">No names, titles or raw reflections</text>
<rect x="1000" y="475" width="360" height="145" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="1000" y="493" width="5" height="109" rx="2" fill="#087F82"/>
