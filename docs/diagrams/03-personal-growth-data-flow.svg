<text x="1022" y="535.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Recheck sources and consent</text>
<text x="1022" y="558.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Insights, letters and charts</text>
<text x="1022" y="581.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">One paid letter attempt / month</text>
