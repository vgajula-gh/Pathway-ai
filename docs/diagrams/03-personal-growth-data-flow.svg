<text x="1022" y="330.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Experience, goal step, Study</text>
<text x="1022" y="353.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Actual program-action dates</text>
<text x="1022" y="376.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Recheck changed / deleted sources</text>
