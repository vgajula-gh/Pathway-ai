<text x="100" y="706" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#087F82">UI reports the actual result. Direct student CRUD uses separate explicit controls.</text>
<rect x="970" y="160" width="900" height="590" rx="22" fill="#EDF2F9" stroke="#D5DFEB" stroke-width="2"/>
<text x="994" y="196" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#087F82">G  EXPERIENCE → CONFIRMED EVIDENCE → REFLECTION</text>
<text x="994" y="226" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Private records stay in SQL; the AI receives bounded factual options.</text>
