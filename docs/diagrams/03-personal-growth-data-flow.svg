<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440" role="img" aria-labelledby="title desc"><title id="title">03  Personal actions, Growth Map &amp; integrations</title><desc id="desc">Private account scope is server-bound. Models suggest language/actions; code and explicit student decisions govern saved state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97A8BE"/></marker></defs><rect width="1920" height="1440" fill="#F6F8FC"/>
<text x="60" y="65" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#18334D">03  Personal actions, Growth Map &amp; integrations</text>
<text x="60" y="103" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#53677E">Private account scope is server-bound. Models suggest language/actions; code and explicit student decisions govern saved state.</text>
<text x="60" y="1400" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53677E">PATHWAY AI  |  Implemented baseline: main 1878d9e, Growth Map Drops 1–3  |  Deployment readiness is checked separately</text>
<text x="1810" y="1400" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#53677E">3 / 3</text>
<rect x="50" y="160" width="880" height="590" rx="22" fill="#EDF2F9" stroke="#D5DFEB" stroke-width="2"/>
<text x="74" y="196" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315EEA">B  BUDDY → APPROVAL → OBSERVED RESULT</text>
<text x="74" y="226" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Private task context may reach the selected inference provider.</text>
<rect x="80" y="270" width="360" height="145" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="80" y="288" width="5" height="109" rx="2" fill="#087F82"/>
<text x="102" y="295" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">B1  Student request</text>
<text x="102" y="330.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Session + consent + quota</text>
<text x="102" y="353.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Own request, profile and goals</text>
<text x="102" y="376.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Up to 12 recent messages</text>
<rect x="520" y="270" width="360" height="145" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="520" y="288" width="5" height="109" rx="2" fill="#315EEA"/>
<text x="542" y="295" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">B2  Model + tools</text>
<text x="542" y="330.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Allowed tools; up to 6 rounds</text>
<text x="542" y="353.64000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Server-bound student scope</text>
<text x="542" y="376.68000000000006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Read results; no arbitrary writes</text>
<rect x="520" y="475" width="360" height="145" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="520" y="493" width="5" height="109" rx="2" fill="#7454B5"/>
<text x="542" y="500" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18334D">B3  Student review</text>
<text x="542" y="535.6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Typed actions, reasons, effects</text>
<text x="542" y="558.64" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Student approves or rejects</text>
<text x="542" y="581.68" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#53677E">Model cannot approve itself</text>
<rect x="80" y="475" width="360" height="145" rx="16" fill="white" stroke="#D5DFEB" stroke-width="2"/>
<rect x="80" y="493" width="5" height="109" rx="2" fill="#7454B5"/>
